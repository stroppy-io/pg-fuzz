name: ci

# WHAT THIS IS FOR.
#
# Every defect this repository's audits turned up shared one shape: correct,
# tested code that nobody called. The unit tests were green throughout, because
# they exercised libraries rather than the commands that use them. So CI runs
# the tests AND checks the wiring: that the binary builds, that every command
# in the usage text is reachable, and that no package is compiled into the
# binary with no caller at all.
#
# It deliberately does NOT fuzz. A fuzzing run needs docker, a PostgreSQL
# clone, and hours; a green CI here means "the tool is sound", not "the fuzzer
# found nothing".
#
# EVERY JOB IS ONE LINE, calling scripts/ci.sh. That is the point: the script
# is what runs here and what runs on a laptop, so "green locally" and "green on
# GitHub" are the same claim rather than two that drift apart. They already had:
# this file pinned Go 1.24 while go/go.mod declared 1.27, a toolchain that
# cannot build the module, so every push would have failed -- two statements of
# one fact, which is the defect the audits were about.
#
# Run the whole thing locally with `scripts/ci.sh`, or through act:
#     act -j test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # THE VERSION THE MODULE ASKS FOR, read from it. A number written
          # here as well is a second statement of the same fact, and this one
          # was already wrong.
          go-version-file: go/go.mod
          # No cache-dependency-path: there is no go.sum, because there are no
          # dependencies. Pointing setup-go at a file that does not exist is
          # how a workflow fails before it runs anything.
          cache: false
      - run: scripts/ci.sh test

  wiring:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          # No cache-dependency-path: there is no go.sum, because there are no
          # dependencies. Pointing setup-go at a file that does not exist is
          # how a workflow fails before it runs anything.
          cache: false
      - run: scripts/ci.sh wiring

  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: clang
        run: sudo apt-get update -qq && sudo apt-get install -y -qq clang
      - run: scripts/ci.sh harness
