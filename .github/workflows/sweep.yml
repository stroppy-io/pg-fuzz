name: sweep

# THE PIPELINE, END TO END, WITH THE BUDGETS TURNED DOWN.
#
# The purpose is not to fuzz. It is to make sure that when somebody commits ten
# or twenty hours of machine time to a real campaign, they are not doing it on
# top of a botched script -- and the only way to know that is to RUN the same
# code path first, cheaply.
#
# So each item is a miniature campaign, not a bare sweep: it builds, seals,
# rounds, gates, ratchets, reports, bundles and archives, exactly as an
# overnight run does, with per-target budgets of seconds instead of minutes.
# A bare sweep would exercise about a third of that and leave the rest -- the
# manifest, the rounds, the gate wiring, the report, the bundle -- to be
# discovered broken at hour nineteen.
#
# What it proves, per major and per sanitizer: the ref exports, the patch
# series applies with no .rej, every declared plugin compiles and loads, all 23
# targets build and EXECUTE, a campaign completes its rounds, the gates run and
# read what the campaign wrote, and a report and a bundle can be produced from
# it. That is the set of things this port broke repeatedly, none of it visible
# from a unit test.
#
# WHAT IT DOES NOT PROVE: that the fuzzer finds anything. Every item starts
# COLD, deliberately. Corpus size and coverage are both functions of time, so
# neither is worth chasing in a run measured in seconds -- and caching a corpus
# across a ten-item matrix against a 10 GB repository quota buys thrash rather
# than reach. Treating a green run here as "no bugs" would be exactly the
# artifact-versus-finding confusion the reports spend a section correcting.
#
# For the same reason nothing here measures coverage: a coverage build is
# 4.6 GB against an address build's 1.5, and the number it produces after eight
# seconds a target says nothing anyone should read.
#
# DISK. Measured on the fuzzing host: base-builder 3.15 GB, the project image
# ~0.3 GB on top, a shallow PostgreSQL clone ~250 MB, the exported tree ~2.6 GB
# and an address/undefined build 1.5 GB -- about 8.5 GB per item, against the
# ~14 GB a runner starts with. Each matrix item is its own runner, so that is
# 8.5 of 14, not 85 of 14. The reclaim step below buys another 20-30 GB because
# the margin is otherwise thin, and a `coverage` build (4.6 GB) is deliberately
# not in this matrix.
#
# pgfuzz refuses to build below 15 GB free. That threshold is right for the
# fuzzing host, where a build competes with 65 workspaces and live campaigns,
# and wrong for a disposable runner -- hence -no-disk-check here and nowhere
# else.

# MANUAL ONLY UNTIL IT HAS RUN ONCE.
#
# This workflow has never executed -- not here and not on GitHub. act cannot
# run it, because the oss-fuzz build needs docker inside the runner container,
# so nothing has yet observed whether the disk arithmetic holds on a real
# runner or whether the artifact globs match anything.
#
# A ten-item matrix that fires on every push to main, having never run, is
# exactly the unproven script this CI exists to catch. It gets its push trigger
# back when a manual run has been green once. See TODO-ci.md.
on:
  workflow_dispatch:
    inputs:
      seconds:
        description: 'seconds per target (23 targets: 30s is ~12min, 300s is ~2h)'
        default: '30'
      majors:
        description: 'space-separated refs, or empty for the full matrix'
        default: ''

permissions:
  contents: read

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 330   # under the 360 cap, so a hang is ours to report
    strategy:
      fail-fast: false     # one broken major must not hide the other nine
      matrix:
        ref: [REL_16_STABLE, REL_17_STABLE, REL_18_STABLE, REL_19_STABLE, master]
        sanitizer: [address, undefined]

    steps:
      - uses: actions/checkout@v4

      # ~25 GB of preinstalled toolchains this never uses. The margin without
      # it is about 5 GB, which is not a margin.
      #
      # BEFORE setup-go, AND NOT TOUCHING THE TOOL CACHE. The first run of this
      # workflow put this step after setup-go and deleted
      # $AGENT_TOOLSDIRECTORY -- which is exactly where setup-go had just
      # installed Go. All ten items died with exit 127, "go: command not
      # found", having reclaimed the thing they needed.
      - name: reclaim disk
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/lib/jvm || true
          docker image prune -af >/dev/null 2>&1 || true
          df -h / | tail -1

      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache: false

      # Into a directory that exists, and onto PATH for every later step --
      # neither of which was true the first time this ran.
      # THE BINARY MOUNTS ITSELF INTO THE BUILD CONTAINER, so its path has to
      # exist for the daemon that starts that container. On a real runner
      # $HOME is a host path and anywhere works. Under act it is not: the
      # daemon is the HOST's, it cannot see act's $HOME, and docker helpfully
      # creates the missing mount source as an empty DIRECTORY -- which fails
      # as `exec: "/pgfuzz": is a directory`, four layers from the cause.
      # Installing under the shared root keeps one rule: anything the build
      # container mounts lives somewhere both sides can see.
      - name: build pgfuzz
        run: |
          bin="${PGFUZZ_ACT_ROOT:-$HOME/.local}/bin"
          mkdir -p "$bin"
          (cd go && go build -o "$bin/pgfuzz" ./cmd/pgfuzz)
          echo "$bin" >> "$GITHUB_PATH"
          "$bin/pgfuzz" 2>&1 | head -2

      - name: roots
        run: |
          # The four roots, all under the runner's own disk.
          #
          # PGFUZZ_ACT_ROOT overrides the base, and exists for ONE reason:
          # running this workflow locally under act. The oss-fuzz build runs
          # on the HOST docker daemon, so it mounts host paths -- while act's
          # $RUNNER_TEMP lives inside act's own container and is invisible
          # there. The builder then mounts an empty directory, build.sh finds
          # no .pgfuzz-ref, and the failure looks like a bad export.
          #
          # Pointing both at one bind-mounted path makes the whole pipeline
          # runnable here. On a real runner the variable is unset and this is
          # $RUNNER_TEMP, exactly as before.
          base="${PGFUZZ_ACT_ROOT:-$RUNNER_TEMP}"
          echo "PGFUZZ_HOME=$GITHUB_WORKSPACE"       >> "$GITHUB_ENV"
          echo "PGFUZZ_WS=$base/ws"                  >> "$GITHUB_ENV"
          echo "PGFUZZ_CACHE=$base/cache"            >> "$GITHUB_ENV"
          # LOWERCASE, because the workspace name becomes a docker image tag
          # and a repository name must be lowercase. REL_16_STABLE does not,
          # so every item died at `docker build -t
          # gcr.io/oss-fuzz/pgfuzz-ci-REL_16_STABLE-address` with "repository
          # name must be lowercase" -- a docker USAGE error, which is why the
          # message was "Run 'docker build --help'" rather than a build log.
          ws="ci-${{ matrix.ref }}-${{ matrix.sanitizer }}"
          echo "WS=$(printf '%s' "$ws" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: clone the substrate
        run: |
          mkdir -p "$PGFUZZ_WS" "$PGFUZZ_CACHE"
          # Shallow, and only what a PostgreSQL build needs: the OrioleDB
          # clones are another 700 MB this matrix never touches.
          pgfuzz bootstrap -shallow -only postgres,oss-fuzz

      - name: workspace
        run: |
          pgfuzz ws -new "$WS" -ref "origin/${{ matrix.ref }}" \
                    -sanitizer "${{ matrix.sanitizer }}"
          # A PATCH AND PLUGINS, because both are pipelines that were wired to
          # nothing at some point in this port's history. The patch adds a file
          # nothing compiles, so it applies to every major and cannot change
          # what is built; what it proves is that the series ran at all.
          conf="$PGFUZZ_WS/$WS/workspace.conf"
          echo "patch=$GITHUB_WORKSPACE/project/patches/0001-ci-marker.patch" >> "$conf"
          echo "plugins=pgaudit pg_background pgsql-http" >> "$conf"
          cat "$conf"

      # NO SEPARATE BUILD STEP.
      #
      # The campaign inside smoke.sh builds into the slug, so a `pgfuzz build`
      # here compiled PostgreSQL a SECOND time -- about twenty wasted minutes
      # an item -- and did it without -no-pin, so every item died on a moving
      # branch that had moved. The campaign owns the build; a build failure
      # surfaces as smoke.sh's campaign step, which names it.

      # THE WHOLE PIPELINE, through the same script that runs on a laptop.
      #
      # Inlining these steps here would be the two-statements-of-one-fact
      # problem that produced the Go version skew: what CI runs has to be what
      # a person can run before pushing, or the two drift and only one of them
      # is ever checked.
      - name: smoke
        env:
          PGFUZZ_SMOKE_SLUG: ci
          PGFUZZ_SMOKE_OUT: ${{ runner.temp }}/out
        run: |
          secs='${{ github.event.inputs.seconds }}'
          scripts/smoke.sh "$WS" "${secs:-8}"

      # THE PATCH REACHED THE TREE, asserted rather than assumed: this is the
      # pipeline that was silently dead once already. After the build, because
      # the build is what records it.
      - name: the patch applied
        if: always()
        run: |
          grep -q '^patch_applied=' "$PGFUZZ_WS/$WS/workspace.conf" \
            || { echo "the build recorded no applied patch"; exit 1; }
          pgfuzz inventory -w "$WS" | grep -i 'ci-marker' \
            || { echo "the inventory cannot name the patch"; exit 1; }

      - name: what it produced
        if: always()
        run: |
          pgfuzz ws | grep "$WS" || true
          find "$PGFUZZ_WS/$WS/artifacts" -type f \
               \( -name 'crash-*' -o -name 'oom-*' -o -name 'timeout-*' -o -name 'leak-*' \) \
               -printf '%p\n' 2>/dev/null | head -50

      # A crash found here must be retrievable, or finding it was pointless.
      # TWO UPLOADS, BECAUSE THE TWO HALVES FAIL DIFFERENTLY.
      #
      # A sanity-check sweep normally finds NOTHING, so an empty reproducer set
      # is the expected result and `ignore` is right. The record is the
      # opposite: a manifest, a series and a report are produced by every run
      # that got as far as this step, so their absence means a step did not do
      # what it said. Uploading both under one `ignore` made "no crashes" and
      # "the pipeline produced nothing" the same green tick.
      #
      # A SEALED CAMPAIGN WRITES UNDER THE SLUG. Every path here was wrong
      # before: they named $PGFUZZ_WS/<ws>/..., which is the UNSEALED layout,
      # while smoke.sh runs `campaign -sealed -slug ci` and writes to
      # $PGFUZZ_WS/campaigns/ci/ws/<ws>/. Each glob matched nothing, and
      # if-no-files-found: ignore meant a sweep that CRASHED would have
      # uploaded no reproducer and still gone green.
      - name: upload reproducers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repro-${{ matrix.ref }}-${{ matrix.sanitizer }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            ${{ env.PGFUZZ_WS }}/campaigns/ci/ws/${{ env.WS }}/artifacts/*/crash-*
            ${{ env.PGFUZZ_WS }}/campaigns/ci/ws/${{ env.WS }}/artifacts/*/oom-*
            ${{ env.PGFUZZ_WS }}/campaigns/ci/ws/${{ env.WS }}/artifacts/*/timeout-*
            ${{ env.PGFUZZ_WS }}/campaigns/ci/ws/${{ env.WS }}/artifacts/*/leak-*
            ${{ env.PGFUZZ_WS }}/campaigns/ci/gate-failures.jsonl

      # The evidence a failure is read from: the per-target run logs the gates
      # parse, the build log, and the documents.
      #
      # `run-*.log*`, NOT `run-*.log`. The runner gzips the larger logs, so the
      # narrower glob quietly dropped 5 of 23 targets from the first record it
      # produced -- including both targets that had saved a crash artifact --
      # and the upload was green either way. The samples and the per-slice cpu
      # files come too: they are how a slice proves it did work, and a target
      # that ran and a target that did nothing are otherwise the same silence.
      #
      # `error` on purpose -- but be
      # precise about what it buys: upload-artifact fails only when NO path
      # matches, so this catches "the run produced nothing" and not "the
      # manifest is missing while the logs are there". The per-file assertions
      # belong to smoke.sh, which checks each step as it runs; this is the
      # backstop for a job that went green having produced no record at all.
      - name: upload the record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: record-${{ matrix.ref }}-${{ matrix.sanitizer }}
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ env.PGFUZZ_WS }}/campaigns/ci/ws/${{ env.WS }}/artifacts/*/run-*.log*
            ${{ env.PGFUZZ_WS }}/campaigns/ci/ws/${{ env.WS }}/artifacts/*/run-*.cpu
            ${{ env.PGFUZZ_WS }}/campaigns/ci/ws/${{ env.WS }}/artifacts/*/*.samples.jsonl
            ${{ env.PGFUZZ_WS }}/campaigns/ci/ws/${{ env.WS }}/build.log
            ${{ env.PGFUZZ_WS }}/campaigns/ci/series.jsonl
            ${{ env.PGFUZZ_WS }}/campaigns/ci/MANIFEST.json
            ${{ runner.temp }}/out/report.md
            ${{ runner.temp }}/out/index.html
            ${{ runner.temp }}/out/bundle/*.tar.gz
